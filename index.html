<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Application Deadlines – Fall 2027</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>" />
  <style>
:root {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --text: #1d2433;
  --muted: #6b7385;
  --border: #e3e6ee;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --danger: #d6336c;
  --today: #fff4d6;
  --radius: 10px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); }
button, input, select, textarea { font: inherit; }

button {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
}
button:hover { border-color: #c5cad8; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--danger); }
input, select, textarea {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  background: #fff;
}

/* Top bar */
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
}
.brand h1 { margin: 0; font-size: 1.25rem; }
.subtitle { color: var(--muted); font-size: .85rem; }
.actions { display: flex; gap: 8px; align-items: center; }
.menu { position: relative; }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 20;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0,0,0,.08); display: flex; flex-direction: column; min-width: 220px; padding: 4px;
}
.menu-list button { border: none; text-align: left; border-radius: 6px; }
.menu-list button:hover { background: var(--bg); }

/* Toolbar */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center;
  padding: 12px 24px;
}
.nav { display: flex; align-items: center; gap: 6px; }
.nav h2 { margin: 0 0 0 10px; font-size: 1.2rem; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#searchInput { min-width: 240px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: none; border-radius: 0; }
.seg button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* Layout */
.layout { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 0 24px 24px; }
@media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

/* Month grid */
.calendar {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
}
.weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.weekdays div {
  padding: 8px; font-size: .8rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; border-bottom: 1px solid var(--border);
}
.cell {
  min-height: 112px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0;
}
.cell:nth-child(7n) { border-right: none; }
.cell:hover { background: #fafbff; }
.cell.other { background: #fbfbfd; color: #b0b5c3; }
.cell.today { background: var(--today); }
.cell .num { font-size: .85rem; font-weight: 600; }
.cell.today .num {
  background: var(--accent); color: #fff; border-radius: 999px; width: 24px; height: 24px;
  display: inline-flex; align-items: center; justify-content: center;
}
.chip {
  font-size: .75rem; padding: 2px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; border-left: 3px solid; cursor: pointer;
}
.chip.done { opacity: .45; text-decoration: line-through; }
.chip.high::before { content: "● "; color: var(--danger); }
.more { font-size: .75rem; color: var(--muted); }

/* Agenda */
.agenda {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 16px 16px;
}
.agenda h4 {
  margin: 18px 0 6px; font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
}
.agenda-item {
  display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; align-items: center;
  padding: 10px; border-radius: 8px; border-left: 4px solid; margin-bottom: 6px; background: #fafbfe; cursor: pointer;
}
.agenda-item:hover { background: #f1f3fb; }
.agenda-item.done { opacity: .5; }
.agenda-item.done .t { text-decoration: line-through; }
.agenda-item .d { font-weight: 600; font-size: .9rem; }
.agenda-item .t { font-weight: 600; }
.agenda-item .meta { font-size: .82rem; color: var(--muted); }
.badge { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.badge.urgent { background: #ffe3ec; color: var(--danger); font-weight: 600; }
.badge.past { background: #eee; }
.empty { color: var(--muted); padding: 24px; text-align: center; }

/* Sidebar */
.sidebar {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 16px; align-self: start; position: sticky; top: 12px;
}
.sidebar h3 { font-size: .9rem; margin: 8px 0; }
.upcoming, .legend, .day-list { list-style: none; margin: 0; padding: 0; }
.upcoming li {
  padding: 8px; border-radius: 8px; border-left: 3px solid; margin-bottom: 6px; background: #fafbfe; cursor: pointer;
}
.upcoming li .t { font-size: .88rem; font-weight: 600; }
.upcoming li .meta { font-size: .78rem; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.legend li { display: flex; align-items: center; gap: 8px; font-size: .85rem; margin-bottom: 4px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; }

/* Dialogs */
dialog {
  border: none; border-radius: 14px; padding: 20px 22px; width: min(560px, 94vw);
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
dialog::backdrop { background: rgba(20,24,40,.35); }
dialog h3 { margin-top: 0; }
#editForm label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
#editForm label.check { flex-direction: row; }
#editForm .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.dialog-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.spacer { flex: 1; }
.day-list li {
  border-left: 4px solid; padding: 8px 10px; background: #fafbfe; border-radius: 8px; margin-bottom: 8px; cursor: pointer;
}
.day-list .meta { font-size: .82rem; color: var(--muted); }
.day-list a { font-size: .82rem; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: .9rem; z-index: 50;
}
[hidden] { display: none !important; }

</style>
</head>

  <header class="topbar">
    <div class="brand">
      <h1>University Application Deadlines – Fall 2027</h1>
      <span class="subtitle" id="todayLabel"></span>
    </div>
    <div class="actions">
    </div>
  </header>

  <section class="toolbar">
    <div class="nav">
      <button id="prevBtn" aria-label="Previous">‹</button>
      <button id="todayBtn">Today</button>
      <button id="nextBtn" aria-label="Next">›</button>
      <h2 id="periodLabel"></h2>
    </div>
    <div class="filters">
      <input type="search" id="searchInput" placeholder="Search university, title, notes…" />

      <select id="typeFilter"><option value="">All types</option></select>
      <label class="check"><input type="checkbox" id="hidePast" /> Hide past deadlines</label>
      <div class="seg" role="tablist">
        <button data-view="month" class="active">Month</button>
        <button data-view="agenda">List</button>
      </div>
    </div>
  </section>

  <main class="layout">
    <section id="calendarView" class="calendar"></section>
    <section id="agendaView" class="agenda" hidden></section>

    <aside class="sidebar">
      <h3>Coming up</h3>
      <ul id="upcomingList" class="upcoming"></ul>
      <h3>Legend</h3>
      <ul id="legend" class="legend"></ul>
    </aside>
  </main>

  <!-- Day detail dialog -->
  <dialog id="dayDialog">
    <h3 id="dayTitle"></h3>
    <ul id="dayList" class="day-list"></ul>
    <div class="dialog-actions">
      <span class="spacer"></span>
      <button type="button" id="dayCloseBtn">Close</button>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

      if (cell) openDay(cell.dataset.day);
    };
    $("agendaView").onclick = (e) => { const it = e.target.closest("[data-id]"); if (it) show(it.dataset.id); };
    $("upcomingList").onclick = (e) => {
      const it = e.target.closest("[data-id]"); if (!it) return;
      const d = byId(it.dataset.id);
      if (d) { state.cursor = startOfMonth(fromKey(d.date)); render(); openDay(d.date, d.id); }
    };
    $("dayCloseBtn").onclick = () => $("dayDialog").close();

    // Keyboard: ← → change month, T = today
    document.addEventListener("keydown", (e) => {
      if (document.querySelector("dialog[open]") || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      if (e.key === "ArrowLeft") $("prevBtn").click();
      if (e.key === "ArrowRight") $("nextBtn").click();
      if (e.key.toLowerCase() === "t") $("todayBtn").click();
    });
  }

  // ---------- Init ----------
  bind();
  load().then(() => {
    const next = state.deadlines.map((d) => d.date).filter((d) => d >= todayKey()).sort()[0];
    if (next) state.cursor = startOfMonth(fromKey(next));
    render();
  });
})();

</script>
</body>
</html>
